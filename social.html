<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swan Lake XR — social card</title>
<style>
  /* 1200x630 OpenGraph card. Background is a real capture from the app. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #060810; }
  body { position: relative; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; color: #fff; }
  .bg { position: absolute; inset: 0; background: url("docs/dusk_fireworks.png") center 38% / cover no-repeat; }
  .shade { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(6,8,16,.94) 0%, rgba(6,8,16,.80) 36%, rgba(6,8,16,.25) 70%, rgba(6,8,16,0) 100%),
      linear-gradient(0deg, rgba(6,8,16,.55) 0%, rgba(6,8,16,0) 38%); }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px;
    display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 21px; font-weight: 400; letter-spacing: .42em; text-transform: uppercase;
    color: rgba(255,255,255,.72); margin-bottom: 26px; }
  h1 { margin: 0; font-size: 104px; line-height: .98; font-weight: 300; letter-spacing: -.02em; }
  .tag { margin-top: 30px; font-size: 29px; line-height: 1.38; font-weight: 300; color: rgba(255,255,255,.86); }
  .chips { margin-top: 38px; display: flex; gap: 14px; }
  .chips span { font-size: 18px; font-weight: 400; letter-spacing: .06em; padding: 9px 18px;
    border: 1px solid rgba(255,255,255,.38); border-radius: 999px; color: rgba(255,255,255,.88); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="copy">
    <div class="eyebrow">Agile Lens</div>
    <h1>Swan<br>Lake XR</h1>
    <div class="tag">Conduct a moonlit lake of swans with a baton.<br>An OpenXR vignette for PICO's next headset.</div>
    <div class="chips"><span>Godot 4.7</span><span>OpenXR</span><span>100% procedural</span></div>
  </div>
</body>
</html>
